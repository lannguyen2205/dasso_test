services:
  keycloak:
    build:
      context: ./keycloak
      dockerfile: Dockerfile
    container_name: dasso-keycloak
    environment:
      KC_DB: ${KC_DB:-postgres}
      KC_DB_URL: ${KC_DB_URL}
      KC_DB_USERNAME: ${KC_DB_USERNAME}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-admin}
      KC_PROXY_HEADERS: "xforwarded"
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "8080:8080"
    restart: unless-stopped

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: dasso-server
    environment:
      PORT: 4000
      KEYCLOAK_URL: http://keycloak:8080
    ports:
      - "4000:4000"
    restart: unless-stopped

  # Two Next.js apps for testing Keycloak SSO: App A :3001, App B :3002 (see README.md)
  web-a:
    build:
      context: ./web-a
      dockerfile_inline: &web_dockerfile |
        FROM node:20-alpine
        WORKDIR /app
        COPY package*.json ./
        RUN npm install
        COPY . .
        CMD ["npm", "run", "dev"]
    container_name: dasso-web-a
    ports:
      - "3001:3001"
    environment:
      NEXT_PUBLIC_KEYCLOAK_URL: http://localhost:8080
      NEXT_PUBLIC_KEYCLOAK_REALM: dasso
      NEXT_PUBLIC_SERVER_URL: http://localhost:4000
    restart: unless-stopped

  web-b:
    build:
      context: ./web-b
      dockerfile_inline: *web_dockerfile
    container_name: dasso-web-b
    ports:
      - "3002:3002"
    environment:
      NEXT_PUBLIC_KEYCLOAK_URL: http://localhost:8080
      NEXT_PUBLIC_KEYCLOAK_REALM: dasso
      NEXT_PUBLIC_SERVER_URL: http://localhost:4000
    restart: unless-stopped

  # Optional local PostgreSQL if testing without Supabase
  # Run: docker compose --profile local-db up -d
  postgres:
    image: postgres:16-alpine
    container_name: dasso-postgres
    profiles:
      - local-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

volumes:
  postgres_data:
