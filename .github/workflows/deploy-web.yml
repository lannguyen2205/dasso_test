name: Deploy Web Apps to Vercel

on:
  push:
    branches:
      - deploy
    paths:
      - 'web-a/**'
      - 'web-b/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

jobs:
  detect-changes:
    name: Detect changed web apps
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.detect.outputs.apps }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pick apps to deploy
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          ALL='["web-a","web-b"]'
          # Manual run or first push of the branch (no previous commit) -> deploy both apps
          if [ "$EVENT_NAME" != "push" ] || ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            echo "apps=$ALL" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA")
          # Workflow itself changed -> deploy both apps
          if echo "$CHANGED" | grep -qx '.github/workflows/deploy-web.yml'; then
            echo "apps=$ALL" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          APPS=$(echo "$CHANGED" | grep -oE '^web-[ab]/' | tr -d '/' | sort -u | jq -R . | jq -sc .)
          echo "Changed apps: $APPS"
          echo "apps=$APPS" >> "$GITHUB_OUTPUT"

  deploy-web:
    name: Deploy ${{ matrix.app }} to Vercel
    needs: detect-changes
    if: needs.detect-changes.outputs.apps != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.detect-changes.outputs.apps) }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          # Vercel project per app; override with repo variables VERCEL_PROJECT_WEB_A / VERCEL_PROJECT_WEB_B
          VERCEL_PROJECT: ${{ matrix.app == 'web-a' && (vars.VERCEL_PROJECT_WEB_A || 'dasso-test') || (vars.VERCEL_PROJECT_WEB_B || 'dasso-test-b') }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "Notice: VERCEL_TOKEN secret is not configured in GitHub Secrets."
            echo "If Vercel is connected directly to this GitHub repository on branch deploy,"
            echo "Vercel Git Integration handles automatic deployments without requiring GitHub Actions."
            exit 0
          fi
          npm install --global vercel@latest
          # Link and deploy from repository root; each Vercel project's Root Directory
          # setting (web-a / web-b) selects which app gets built.
          vercel link --yes --project "$VERCEL_PROJECT" --token "$VERCEL_TOKEN"
          vercel deploy --prod --token "$VERCEL_TOKEN"
